# Spans the trace checker (tracing/checker) allows without children, and detached work it allows
# to outlast its parent. Everything else must show what it did: a span with no children and no
# entry here fails rule I4. Each entry needs a reason. service and name are globs.

[[leaf]]
service = "auth"
name = "password.verify"
reason = "argon2 verification: CPU only, about 20 ms by design"

[[leaf]]
service = "auth"
name = "password.hash"
reason = "argon2 hashing: CPU only"

[[leaf]]
service = "milesstorm-web"
name = "camera session"
reason = "the WebSocket handshake as the browser sees it; the browser exposes nothing inside it"

[[follows]]
service = "auth"
name = "email.verify_send"
reason = "sent after the response: registration doesn't wait for the email provider"
