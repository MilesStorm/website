# Shares eta's GPUs with production (GPU operator time-slicing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-pipeline-deployment
spec:
  replicas: 2
  # No surge pod: the namespace quota has no room for it.
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      containers:
        - name: ai-pipeline
          env:
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment.name=staging"}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1536Mi, nvidia.com/gpu: "1"}
