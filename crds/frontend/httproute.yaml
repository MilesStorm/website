# Public route for milesstorm.com on the homelab's Gateway API front door
# (Gateway "public" in istio-ingress, defined in the homelab repo).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: frontend
spec:
  parentRefs:
    - {name: public, namespace: istio-ingress}
  hostnames: [milesstorm.com]
  rules:
    - backendRefs:
        - {name: frontend-service, port: 80}
