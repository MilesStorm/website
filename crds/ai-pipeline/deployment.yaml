apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ai-pipeline
  name: ai-pipeline-deployment
  labels:
    istio-injection: enabled
    app: ai-pipeline
spec:
  # A pod analyses one frame at a time, so camera sessions on the same pod wait on each
  # other. The cards are shared (GPU operator time-slicing), so pods are not one per card.
  replicas: 3
  revisionHistoryLimit: 2  # old ReplicaSets kept for rollback
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  selector:
    matchLabels:
      app: ai-pipeline
  template:
    metadata:
      labels:
        app: ai-pipeline
        monitoring.milesstorm.com/scrape: "true"
    spec:
      # Only the eta node has NVIDIA GPUs.
      nodeSelector:
        kubernetes.io/hostname: eta
      runtimeClassName: nvidia
      containers:
      - name: ai-pipeline
        image: ghcr.io/milesstorm/ai-pipeline:latest
        ports:
        - containerPort: 9000
          name: ws
        # The port opens only after both models have run once (serve.rs), which takes about a
        # minute. Until then the pod gets no traffic, and in a rollout the old pod keeps serving.
        readinessProbe:
          tcpSocket:
            port: ws
          periodSeconds: 2
        resources:
          limits:
            nvidia.com/gpu: "1"
        env:
          - name: YOLO_MODEL_PATH
            value: "/app/models/yolo26s.bpk"
          - name: DICE_HEAD_PATH
            value: "/app/models/dice_head_resnet18.safetensors"
          # Below this averaged confidence a die is reported as unreadable, never guessed.
          - name: DICE_CONF_THRESHOLD
            value: "0.7"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://alloy.monitoring.svc.cluster.local:4317"
          # Read by the OTel SDK into every span's and log's resource; staging overrides it.
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "deployment.environment.name=production"
      imagePullSecrets:
        - name: dockerconfigjson-github-com
