# Builds the world (catalogue, search index and book vectors) from Open Library's monthly dumps
# and the Goodreads dataset, measures the taste model on the benchmark's gate users, verifies it
# and publishes it to Garage bucket kindred-world
# (services/kindred/README.md). A week into the month, when Open Library's new dumps exist. A
# failed run moves nothing: the previous world stays current (alert KindredWorldBuildFailed in the
# homelab repo). Start one by hand: kubectl create job -n kindred --from=cronjob/kindred-world kindred-world-manual-<n>
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kindred-world
  namespace: kindred
spec:
  schedule: "0 3 8 * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # One retry; the stages already done are skipped.
      backoffLimit: 1
      # A hung run fails after 2 days: the alert fires and next month's run isn't blocked
      # (concurrencyPolicy Forbid).
      activeDeadlineSeconds: 172800
      template:
        metadata:
          labels:
            app: kindred-world
        spec:
          restartPolicy: Never
          # On eta, the node with the GPUs: the text embeddings run there (03-engine.md §3; on
          # the CPU they would take most of a day the first time). The scratch volume's copy
          # stays on gamma's NVMe (scratch.yaml); Longhorn attaches it on eta over the network.
          nodeSelector:
            kubernetes.io/hostname: eta
          runtimeClassName: nvidia
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: kindred-world
              image: ghcr.io/milesstorm/kindred-world:latest
              args: ["build", "--scratch", "/scratch"]
              # Requests only, no limits (the repo's convention), except the GPU, which can only be
              # requested as a limit. DuckDB keeps to its memory_limit in world.toml (6 GB) and
              # spills to the scratch volume beyond it; while the Rust stages run it is held to
              # 1 GB, and the factorization holds the liked pairs (about 5 GB). The Rust stages'
              # thread pool is held to the CPU request (RAYON_NUM_THREADS), so the build leaves
              # eta's other workloads (the game servers) their share; 2 is what fits on eta.
              resources:
                requests:
                  cpu: "2"
                  memory: 12Gi
                limits:
                  nvidia.com/gpu: "1"
              env:
                - name: RAYON_NUM_THREADS
                  value: "2"
                # The read-write key of bucket kindred-world (homelab infisical-app/manifests/kindred.yaml).
                - name: S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: kindred-world-secrets
                      key: S3_ACCESS_KEY_ID
                - name: S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: kindred-world-secrets
                      key: S3_SECRET_ACCESS_KEY
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.monitoring.svc.cluster.local:4317"
                - name: OTEL_RESOURCE_ATTRIBUTES
                  value: "deployment.environment.name=production"
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: scratch
              persistentVolumeClaim:
                claimName: kindred-world-scratch
