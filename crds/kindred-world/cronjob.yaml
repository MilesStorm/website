# Builds the world (catalogue and search index) from Open Library's monthly dumps and the
# Goodreads dataset, verifies it and publishes it to Garage bucket kindred-world
# (services/kindred/README.md). A week into the month, when Open Library's new dumps exist. A
# failed run moves nothing: the previous world stays current (alert KindredWorldBuildFailed in the
# homelab repo). Start one by hand: kubectl create job -n kindred --from=cronjob/kindred-world kindred-world-manual-<n>
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kindred-world
  namespace: kindred
spec:
  schedule: "0 3 8 * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # One retry; the stages already done are skipped.
      backoffLimit: 1
      # A hung run fails after 2 days: the alert fires and next month's run isn't blocked
      # (concurrencyPolicy Forbid).
      activeDeadlineSeconds: 172800
      template:
        metadata:
          labels:
            app: kindred-world
        spec:
          restartPolicy: Never
          # The scratch volume's only copy is on gamma's NVMe (scratch.yaml): run beside it.
          nodeSelector:
            kubernetes.io/hostname: gamma
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: kindred-world
              image: ghcr.io/milesstorm/kindred-world:latest
              args: ["build", "--scratch", "/scratch"]
              # Requests only, no limits (the repo's convention). DuckDB keeps to its
              # memory_limit in world.toml (6 GB) and spills to the scratch volume beyond it.
              resources:
                requests:
                  cpu: "2"
                  memory: 8Gi
              env:
                # The read-write key of bucket kindred-world (homelab infisical-app/manifests/kindred.yaml).
                - name: S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: kindred-world-secrets
                      key: S3_ACCESS_KEY_ID
                - name: S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: kindred-world-secrets
                      key: S3_SECRET_ACCESS_KEY
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.monitoring.svc.cluster.local:4317"
                - name: OTEL_RESOURCE_ATTRIBUTES
                  value: "deployment.environment.name=production"
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: scratch
              persistentVolumeClaim:
                claimName: kindred-world-scratch
