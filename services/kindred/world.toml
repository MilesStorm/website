# Everything the world build is configured by (02-world-data.md §3): sources, thresholds, gates,
# search ranking, where it publishes. Compiled into kindred-world; `--config` reads another file.
# Changing a value here re-runs the stages that use it (their done-markers hash it).

[sources]
# Generic, without contact details (END-CHECKLIST B2: whether to name one is Miles's call).
user_agent = "kindred-world/0.1"

# Open Library's monthly dumps (https://openlibrary.org/developers/dumps). Re-downloaded when the
# remote Last-Modified or size changes.
[sources.openlibrary]
base = "https://openlibrary.org/data"
works = "ol_dump_works_latest.txt.gz"
editions = "ol_dump_editions_latest.txt.gz"
authors = "ol_dump_authors_latest.txt.gz"
ratings = "ol_dump_ratings_latest.txt.gz"
reading_log = "ol_dump_reading-log_latest.txt.gz"
redirects = "ol_dump_redirects_latest.txt.gz"

# UCSD Goodreads Book Graph, late 2017. Downloaded once and kept on the scratch volume.
# Its terms: academic use only, do not redistribute (PLAN.md rule 13): nothing derived from it
# leaves the cluster.
[sources.goodreads]
base = "https://mcauleylab.ucsd.edu/public_datasets/gdrive/goodreads"
books = "goodreads_books.json.gz"
works = "goodreads_book_works.json.gz"
series = "goodreads_book_series.json.gz"
# Who shelved and rated what, with dates (M2: the collaborative block and the benchmark).
interactions = "goodreads_interactions_dedup.json.gz"

[duckdb]
# DuckDB spills to the scratch volume above this.
memory_limit = "6GB"
threads = 2

[identity]
# Share of all Goodreads ratings that must land on a mapped Open Library work. Below it the
# build stops: the usual cause is an ISBN normalisation bug.
min_mapped_share = 0.85

[catalogue]
# A Goodreads work with at least this many ratings counts as a sign of readers.
min_goodreads_ratings = 5
# Other edition titles kept per work, for finding translations and retitlings.
max_other_titles = 5
# A description at least this long counts as a description (report, and the M2 text vectors).
min_description_chars = 200
# Case-insensitive regular expressions; a match flags the work `not_a_book` (searchable, never
# picked).
not_a_book_titles = [
    '\bsummary (of|and analysis)\b',
    '^summary\b',
    '\bstudy guide\b',
    '\bsparknotes\b',
    '\bcliffs ?notes\b',
    '\b(box(ed)? set|boxset)\b',
    '\[collection/set\]',
    '\b(journal|notebook|colou?ring book|planner)$',
]
not_a_book_subjects = [
    '^study guides?$',
    '^(summaries|notes),? ',
    '^box(ed)? sets?$',
    '^blank books?$',
]

[popularity]
# Prior weight `m` of the smoothed average rating (`quality`).
prior_weight = 50.0

[interactions]
# Benchmark users (04-benchmark.md §2). Eligible: at least this many works rated 1-5 stars after
# mapping to Open Library works. Test users are removed before anything is trained; the gate
# subset (the first of the test users) is measured by every monthly build; tuning users stay in
# factor training and fit the prior mean and the hyperparameters.
min_eligible_ratings = 60
test_users = 5000
gate_users = 500
tuning_users = 5000
# Orders the eligible users for the split (and every other draw of the benchmark).
seed = 2017

[factors]
# The collaborative block (03-engine.md §2): implicit matrix factorization on liked pairs
# (4 or 5 stars). Users and works below these counts are dropped, twice.
k = 64
iterations = 20
min_user_likes = 10
min_work_likes = 20
# The cold-book test (04-benchmark.md §4): works first published in this year or later are left
# out of a second factorization and placed by their text instead.
cold_from_year = 2015

[aspects]
# 03-engine.md §2, aspect block: smoothing toward the global share, the weight of one matching
# Open Library subject in shelvings, and the shelvings a work needs for its own aspect numbers
# (fewer: placed by its text).
alpha = 20.0
subject_weight = 5.0
min_shelvings = 20.0
# Unmatched shelf names printed by the stage, to extend aspects.toml with evidence.
report_unmatched = 500

[embed]
# Text embeddings for the text maps (03-engine.md §3). The model directory holds model.onnx and
# tokenizer.json (in the image, services/kindred/Dockerfile). Without it only the fixture world
# builds, with a seeded stand-in.
model_dir = "/opt/kindred/bge-small-en-v1.5"
model_id = "BAAI/bge-small-en-v1.5"
dimensions = 384
max_tokens = 512
batch = 64
# The text given to the model: title, authors, this many subjects, the description's first
# characters.
max_subjects = 10
max_description_chars = 1500

[text_maps]
# Ridge strengths tried for each map; the best on a held-out tenth is used.
ridge = [0.1, 1.0, 10.0, 100.0, 1000.0]

[vectors]
# Popularity (ln(1 + ratings)) a work needs to be picked (02-world-data.md §4): set so that about
# 300,000 works are recommendable.
min_popularity = 4.0

[model]
# The taste model's hyperparameters (03-engine.md). Defaults from the engine document until the
# benchmark's search on the tuning users (kindred-world bench --users tuning) sets them.
var_bias = 4.0
var_c = 2.25
var_a = 0.0225
var_m = 0.25
tau_v = 1.0
tau_c = 0.5
omega_v = 0.5
omega_h = 0.5
text_var = 0.25
# Length of a text-placed collaborative block (03-engine.md §3).
text_shrink = 0.7
# Smallest information worth a comparison question (03-engine.md §7).
ask_min = 0.05
beta = 0.5
b1 = -1.0
b2 = 0.0
b3 = 1.0

[bench]
# The values of n (revealed ratings per user) measured.
revealed = [0, 5, 10, 20, 50]
# Neighbours kept per work by the item-to-item baseline.
neighbours = 200
# Verdict terms sampled at most when fitting the prior mean of the meta block.
max_prior_terms = 2000000
# NDCG@10 at n = 20 on the gate subset when M2 was accepted; every monthly build must reach
# min_share of it. Absent until the benchmark was accepted.
min_share = 0.9

[search]
# A hit's score: text relevance, plus this times popularity (ln(1 + ratings)), plus
# whole_title_bonus when the query is a whole title of the work (last word possibly unfinished).
popularity_weight = 3.0
title_boost = 2.0
other_titles_boost = 1.0
authors_boost = 2.0
series_boost = 1.5
whole_title_bonus = 10.0
# Subtracted from works flagged not_a_book (summaries, study guides, box sets).
not_a_book_penalty = 10.0
retry_below = 3
typo_min_len = 5
# The acceptance list's latency bound, measured over its queries.
p95_ms = 30

[verify]
# Counts that may not move more than this between versions (skipped on the first run).
max_change = 0.20
# The recommendable works must number within this range.
recommendable = [150000, 600000]

[publish]
endpoint = "http://garage.garage.svc.cluster.local:3900"
region = "garage"
bucket = "kindred-world"
