# Shelves that say where or when, not what (03-engine.md Appendix A): left out of a work's
# shelvings, except for the reception group. `organisational_patterns` are whole-name regular
# expressions.
[organisational]
shelves = ["to-read", "currently-reading", "read", "owned", "own", "books-i-own", "i-own",
    "owned-books", "my-books", "my-library", "library", "kindle", "ebook", "ebooks", "e-book",
    "e-books", "audiobook", "audiobooks", "audio", "audible", "wish-list", "wishlist", "to-buy",
    "default", "tbr", "maybe", "on-hold", "borrowed", "book-club", "bookclub", "giveaways", "arc",
    "netgalley", "signed", "hardcover", "paperback", "series", "standalone", "fiction", "general"]
patterns = ['read-in-\d{4}', '\d{4}-reads', '\d{4}', '\d-stars?']
