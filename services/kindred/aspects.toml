# The aspects: readable traits of a book, one number each in the book vector (03-engine.md §2, §5).
# Miles may edit this file; a change takes effect at the next world build. `id` is stored in the
# kindred database: never rename one, add a new id instead. The shelf names are exact Goodreads
# shelf names; `subjects` are lower-case phrases found as whole words in Open Library subjects. The world build's
# aspects stage logs the most-used shelves that match nothing here, to extend it with evidence.
#
# label: the chip text, read after "What made it work?". phrase: used inside reason sentences.
# chip = false: never offered as a chip (genres, forms, reception). steer: "light" or "dark" for
# the Lighter steer. Group reception: shares of all readers (organisational shelves included).

[[aspect]]
id = "fast_paced"
group = "pace"
label = "the pace"
phrase = "a fast pace"
shelves = ["fast-paced", "page-turner", "unputdownable", "action-packed"]
subjects = []
chip = true
steer = ""

