[package]
name = "world-build"
version = "0.1.0"
edition.workspace = true

# Binary kindred-world: the monthly build of the world, the fixture world, and publishing.
[[bin]]
name = "kindred-world"
path = "src/main.rs"

[dependencies]
world = { path = "../world" }
# The taste model: the benchmark measures exactly the code the service runs (04-benchmark.md §1)
taste = { path = "../taste" }
# Ridge regressions of the text maps, the star factorization's row solves
nalgebra = "0.34"
# The factorizations' rows and the benchmark's users in parallel
rayon = "1"
# The text embedding model: ONNX Runtime loaded at run time (the image ships Microsoft's CUDA
# build, as services/ai_pipeline does), and its tokenizer in pure Rust
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "cuda", "api-22"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
# The data joins (sql/). Bundled, with the JSON extension compiled in: no system library and
# nothing fetched from extensions.duckdb.org at run time (trace::Duck turns autoloading off).
duckdb = { version = "~1.20000.1", features = ["bundled", "json"] }
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
# Downloads. TLS set explicitly, one stack (rustls) for reqwest and object_store.
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "http2", "stream", "json"] }
reqwest-middleware = { version = "0.5", features = ["json"] }
reqwest-tracing = { version = "0.7.1", features = ["opentelemetry_0_32"] }
http = "1"
# Garage (S3 API) for publishing
object_store = { version = "0.14", features = ["aws"] }
rand = "0.9"
rand_chacha = "0.9"
tempfile = "3"
# The benchmark's per-reader work on an NVIDIA GPU (bench/gpu.rs, `bench --device cuda`): the
# CUDA driver, cuBLAS, cuSOLVER and NVRTC loaded at run time, as the image's CUDA 13.0 runtime
# (Dockerfile, nvidia/cuda:13.0.2) ships them; nothing linked at build time.
cudarc = { version = "0.19.4", optional = true, default-features = false, features = ["std", "driver", "cublas", "cusolver", "nvrtc", "dynamic-loading", "cuda-13000"] }

# Traces and logs (OTLP → Alloy → Tempo / logs), as the other services
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "logs"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"

[features]
# `kindred-world bench --device cuda` (bench/gpu.rs).
gpu = ["dep:cudarc"]

[dev-dependencies]
# Planted models in the factorization's tests
rand_distr = "0.5"
# Reads allowed_raw_io.toml in tests/allowed_raw_io.rs, Cargo.toml in tests/fixture.rs
toml.workspace = true
