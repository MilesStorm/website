# Kindred: the world builder and its on-disk format (M1). The taste model and the kindred service
# join this workspace later (README.md).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1"
thiserror = "2.0.18"
anyhow = "1.0.102"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1.44"
tantivy = "0.27"
memmap2 = "0.9"
bytemuck = "1"
