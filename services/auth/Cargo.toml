[package]
name = "auth"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.8", features = ["ws", "macros"] }
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-native-tls",
  "postgres",
  "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.50.0", features = ["full"] }
axum-login = { version = "0.18.0" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
dotenvy = { version = "0.15.7" }
# No built-in HTTP client: token requests go through the traced client (src/auth/trace.rs).
oauth2 = { version = "5.0.0", default-features = false }
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
thiserror = "2.0.18"
password-auth = "1.0.0"
# TLS set explicitly: reqwest 0.13 defaults to rustls, and sqlx here uses native-tls. One stack.
reqwest = { version = "0.13.3", default-features = false, features = [
  "native-tls",
  "charset",
  "http2",
  "system-proxy",
  "json",
] }
# A CLIENT span and `traceparent` on every outbound request (src/auth/trace.rs)
reqwest-middleware = { version = "0.5", features = ["json"] }
reqwest-tracing = { version = "0.7.1", features = ["opentelemetry_0_32"] }
serde_json = "1.0.149"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
tower-sessions = { version = "0.14.0", features = ["axum-core"] }
# tower-sessions' `SessionStore` is an async-trait trait (the traced store wrapper implements it)
async-trait = "0.1"
# `http::Extensions` in the client span backend (the version reqwest uses)
http = "1"
# `LevelFilter` for sqlx's pool options
log = "0.4"
# `catch_unwind` on a future: a panic in background work marks its span (src/auth/trace.rs)
futures-util = "0.3"
# TaskTracker: background tasks are awaited at shutdown
tokio-util = { version = "0.7", features = ["rt"] }
jsonwebtoken = "9"
ulid = "1"
# Account email links: random codes, stored hashed
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"

# Metrics (Prometheus exposition format → Alloy → Mimir)
axum-prometheus = "0.10"
metrics = "0.24"

# Distributed tracing (OTLP → Alloy → Tempo) + log bridge (OTLP → Alloy → Loki)
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "logs"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
# `tracing_level_info` raises OtelAxumLayer's per-request span from TRACE to INFO so it
# survives the `info` EnvFilter (RUST_LOG=info). Without it the span is never recorded, so
# no OTel SpanContext exists to capture/propagate — breaking cross-service trace linkage.
axum-tracing-opentelemetry = { version = "0.39", features = ["tracing_level_info"] }
# A client span per Postgres query (peer.service="postgres" → service-graph node)
sqlx-tracing = { version = "0.2", features = ["postgres"] }

[dev-dependencies]
# In-memory span and log exporters for the trace tests
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
# A throwaway Postgres for the tests that need one (Docker)
testcontainers-modules = { version = "0.15", features = ["postgres"] }
# Reads allowed_raw_io.toml in tests/allowed_raw_io.rs
toml = "1"
