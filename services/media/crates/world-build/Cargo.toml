[package]
name = "world-build"
version = "0.1.0"
edition.workspace = true

# Binary media-world: the monthly build of the world, the fixture world, and publishing.
[[bin]]
name = "media-world"
path = "src/main.rs"

[dependencies]
world = { path = "../world" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
# The data joins (sql/). Bundled, with the JSON extension compiled in: no system library and
# nothing fetched from extensions.duckdb.org at run time (trace::Duck turns autoloading off).
duckdb = { version = "~1.20000.1", features = ["bundled", "json"] }
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
# Downloads. TLS set explicitly, one stack (rustls) for reqwest and object_store.
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "http2", "stream", "json"] }
reqwest-middleware = { version = "0.5", features = ["json"] }
reqwest-tracing = { version = "0.7.1", features = ["opentelemetry_0_32"] }
http = "1"
# Garage (S3 API) for publishing
object_store = { version = "0.14", features = ["aws"] }
rand = "0.9"
rand_chacha = "0.9"
tempfile = "3"

# Traces and logs (OTLP → Alloy → Tempo / logs), as the other services
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "logs"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"

[dev-dependencies]
# Reads allowed_raw_io.toml in tests/allowed_raw_io.rs, Cargo.toml in tests/fixture.rs
toml.workspace = true
