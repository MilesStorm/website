# Everything the world build is configured by (02-world-data.md §3): sources, thresholds, gates,
# search ranking, where it publishes. Compiled into media-world; `--config` reads another file.
# Changing a value here re-runs the stages that use it (their done-markers hash it).

[sources]
# Generic, without contact details (END-CHECKLIST B2: whether to name one is Miles's call).
user_agent = "media-world/0.1"

# Open Library's monthly dumps (https://openlibrary.org/developers/dumps). Re-downloaded when the
# remote Last-Modified or size changes.
[sources.openlibrary]
base = "https://openlibrary.org/data"
works = "ol_dump_works_latest.txt.gz"
editions = "ol_dump_editions_latest.txt.gz"
authors = "ol_dump_authors_latest.txt.gz"
ratings = "ol_dump_ratings_latest.txt.gz"
reading_log = "ol_dump_reading-log_latest.txt.gz"
redirects = "ol_dump_redirects_latest.txt.gz"

# UCSD Goodreads Book Graph, late 2017. Downloaded once and kept on the scratch volume.
# Its terms: academic use only, do not redistribute (PLAN.md rule 13): nothing derived from it
# leaves the cluster.
[sources.goodreads]
base = "https://mcauleylab.ucsd.edu/public_datasets/gdrive/goodreads"
books = "goodreads_books.json.gz"
works = "goodreads_book_works.json.gz"
series = "goodreads_book_series.json.gz"

[duckdb]
# DuckDB spills to the scratch volume above this.
memory_limit = "6GB"
threads = 2

[identity]
# Share of all Goodreads ratings that must land on a mapped Open Library work. Below it the
# build stops: the usual cause is an ISBN normalisation bug.
min_mapped_share = 0.85

[catalogue]
# A Goodreads work with at least this many ratings counts as a sign of readers.
min_goodreads_ratings = 5
# Other edition titles kept per work, for finding translations and retitlings.
max_other_titles = 5
# A description at least this long counts as a description (report, and the M2 text vectors).
min_description_chars = 200
# Case-insensitive regular expressions; a match flags the work `not_a_book` (searchable, never
# picked).
not_a_book_titles = [
    '\bsummary (of|and analysis)\b',
    '^summary\b',
    '\bstudy guide\b',
    '\bsparknotes\b',
    '\bcliffs ?notes\b',
    '\b(box(ed)? set|boxset)\b',
    '\[collection/set\]',
    '\b(journal|notebook|colou?ring book|planner)$',
]
not_a_book_subjects = [
    '^study guides?$',
    '^(summaries|notes),? ',
    '^box(ed)? sets?$',
    '^blank books?$',
]

[popularity]
# Prior weight `m` of the smoothed average rating (`quality`).
prior_weight = 50.0

[search]
# A hit's score: text relevance, plus this times popularity (ln(1 + ratings)), plus
# whole_title_bonus when the query is a whole title of the work (last word possibly unfinished).
popularity_weight = 1.0
title_boost = 3.0
other_titles_boost = 1.5
authors_boost = 2.0
series_boost = 1.5
whole_title_bonus = 10.0
# Subtracted from works flagged not_a_book (summaries, study guides, box sets).
not_a_book_penalty = 10.0
retry_below = 3
typo_min_len = 5
# The acceptance list's latency bound, measured over its queries.
p95_ms = 30

[verify]
# Counts that may not move more than this between versions (skipped on the first run).
max_change = 0.20

[publish]
endpoint = "http://garage.garage.svc.cluster.local:3900"
region = "garage"
bucket = "media-world"
