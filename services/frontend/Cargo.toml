[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.3", features = ["json"] }
dotenvy = "0.15.7"
tower-sessions = { version = "0.14" }
tower-sessions-redis-store = "0.16"
axum = { version = "0.8.9" }
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# The JSON API's OpenAPI document comes from the handlers' types (crates/api-types). aide is
# an alpha, pinned exactly.
schemars = "1.2.2"
aide = { version = "=0.16.0-alpha.4", features = ["axum", "axum-json", "axum-query"] }

# OpenTelemetry: bump these together, with reqwest-tracing's `opentelemetry_0_NN` feature
# matching `opentelemetry`. A mismatch still compiles but silently stops trace propagation;
# the tests in crates/bff/src/trace.rs catch it. See TRACING.md ("Upgrading").
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "logs"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
# `tracing_level_info` raises OtelAxumLayer's per-request span from TRACE to INFO so it
# survives the `info` EnvFilter.
axum-tracing-opentelemetry = { version = "0.39", features = ["tracing_level_info"] }
reqwest-middleware = { version = "0.5", features = ["json"] }
reqwest-tracing = { version = "0.7.1", features = ["opentelemetry_0_32"] }

# workspace
api-types = { path = "crates/api-types" }
