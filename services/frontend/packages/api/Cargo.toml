[package]
name = "api"
version = "0.2.1"
edition = "2021"

[dependencies]
api-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }

http = "1"
axum = { workspace = true }
tracing = { workspace = true }
tower-sessions = { workspace = true }
# Same as tower-sessions-core: SessionStore is an #[async_trait] trait (trace::TracedStore).
async-trait = "0.1.89"
reqwest-middleware = { workspace = true }
reqwest-tracing = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
metrics = "0.24"
# The chokepoints in trace.rs: tasks, queues, the ai_pipeline WebSocket, Redis clients, the
# response body that holds the request's span.
tokio = { version = "1", features = ["rt", "sync", "time"] }
# `rt`: TaskTracker (the tasks a shutdown waits for).
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.29"
http-body = "1"
# The same fred the session store uses. `partial-tracing`: a `fred.command` span per command,
# on the clients trace.rs builds with tracing on.
fred = { version = "10.1", default-features = false, features = ["subscriber-client", "partial-tracing"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Reads allowed_raw_io.toml (tests/allowed_raw_io.rs).
toml = "0.8"
tracing-subscriber = { workspace = true }
# `testing`: the in-memory span exporter.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
axum-tracing-opentelemetry = { workspace = true }
