[package]
name = "web"
version = "0.2.2"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
ui = { workspace = true }
api = { workspace = true }
manganis = { version = "0.7.7", features = ["dioxus"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dotenvy = { workspace = true }
tower-sessions = { workspace = true }
tower-sessions-redis-store = { workspace = true }
axum = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Distributed tracing (OTLP → Alloy → Tempo) + log bridge (OTLP → Alloy → Loki).
# Versions live in the workspace manifest; see TRACING.md.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
axum-tracing-opentelemetry = { workspace = true }

# Metrics (Prometheus exposition format → Alloy → Mimir)
axum-prometheus = "0.10"
# `signal`: SIGTERM starts the graceful shutdown (src/main.rs).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
# CancellationToken: tells the long-lived streams to close on shutdown.
tokio-util = "0.7"
# Same fred the session store re-exports; `subscriber-client` adds the
# auto-resubscribing client used for live arcane rolls (src/rolls.rs); `i-scripts`
# the compare-and-delete of the schema lock (src/dataset.rs).
fred = { version = "10.1", default-features = false, features = ["subscriber-client", "i-scripts"] }
# fred's socket2, with `all` for `TcpKeepalive::with_retries` (src/main.rs). tonic 0.12 (OTel
# 0.27) used to turn it on for us.
socket2 = { version = "0.5", features = ["all"] }
# Roll-sharing store (SurrealDB over HTTP /rpc; src/dataset.rs).
reqwest = { workspace = true }
# Applies the roll-sharing tables (surreal/database/schema) at startup.
surrealkit = "=0.7.0"
base64 = "0.22" 
# Profile pictures: decode uploads and re-encode them as small JPEGs (src/account.rs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# InMemoryLogExporter for the log bridge test, the in-memory span exporter for the trace tests
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# A real Redis for the roll hub's trace tests (needs Docker).
testcontainers-modules = { version = "0.15", features = ["redis"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Navigator",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "RequestInit",
    "Response",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rand = "0.9"
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
web = ["dioxus/web"]
server = ["dioxus/server", "ui/server", "api/server"]
