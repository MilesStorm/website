# Every `#[allow(clippy::disallowed_*)]` in packages/api and packages/web: the places allowed
# to use an I/O constructor that clippy.toml bans (TRACING.md, "Chokepoints"). A site is
# matched by its file, lints and `reason` text; packages/api/tests/allowed_raw_io.rs fails
# when a site isn't listed here or an entry here has no site. Adding one is a reviewed change.

