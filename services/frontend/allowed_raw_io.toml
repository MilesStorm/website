# Every `#[allow(clippy::disallowed_*)]` in crates/bff: the places allowed to use an I/O
# constructor that clippy.toml bans (TRACING.md, "Chokepoints"). A site is matched by its file,
# lints and `reason` text; crates/bff/tests/allowed_raw_io.rs fails when a site isn't listed
