name: ci-runner

# The cluster's runner image (ci/runner/Dockerfile), ghcr.io/milesstorm/ci-runner. The runners
# follow its newest build through Image Updater (homelab repo, ci-runners), by the tag of its UTC
# build time (YYYYMMDD-HHMMSS), which sorts as it was built; sha-<commit> says what it was built
# from. Weekly as well, for the newest stable Rust and Ubuntu's updates. Only main publishes; a
# branch that changes the image only builds and checks it. Built on a GitHub runner, so the
# cluster's runners never build their own replacement.

on:
  push:
    paths:
      - ci/runner/**
      - .github/workflows/ci-runner.yml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-runner-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/milesstorm/ci-runner

jobs:
  image:
    name: Runner image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tags
        id: tags
        run: echo "tags=$IMAGE:sha-${GITHUB_SHA::7},$IMAGE:$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: ci/runner
          # From scratch every time: a cached layer would keep last week's Rust and packages.
          pull: true
          no-cache: true
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      # As a runner pod starts it: the runner's user, its own program, and the job's tools.
      - name: The image works
        run: |
          docker run --rm --user runner --entrypoint bash "$IMAGE:sha-${GITHUB_SHA::7}" -c '
            set -e
            /home/runner/bin/Runner.Listener --version | grep -x "[0-9.]*"
            test -x /home/runner/run.sh && test -d /home/runner/externals
            cargo clippy --version && sccache --version && cc --version | head -1
            python3 -m venv /tmp/venv && pkg-config --exists openssl'
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: docker push --all-tags "$IMAGE"
