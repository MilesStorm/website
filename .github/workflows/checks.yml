name: checks

# Clippy and the tests of every service, on every push and pull request (TRACING.md, "Checks").
# No path filters, so the jobs can be required checks. ai_pipeline builds without CUDA (burn
# loads it at run time) and no test needs a GPU, so it runs on GitHub's runners; e2e builds the
# image on eta (below).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/frontend
      # asset! needs the vendored Faro bundles and the Tailwind CSS at compile time.
      - run: npm ci && npm run vendor
      - run: node_modules/.bin/tailwindcss -i packages/ui/tailwind.css -o packages/ui/assets/styling/tailwind.css --minify
      - run: cargo clippy -p api-types -p api -p web --features web/server --all-targets -- -D warnings
      - run: cargo test -p api-types -p api -p web --features web/server
      - run: npm run test:trace
      # The committed API contract is what the handlers say (web/src/api/openapi.json), and the
      # TypeScript types are generated from it: regenerate both with `npm run api` in web/.
      - name: OpenAPI document is current
        run: cargo run -q -p web --features web/server -- openapi | diff - web/src/api/openapi.json
      - name: TypeScript API types are current
        working-directory: services/frontend/web
        run: npm ci && npm run api:types && git diff --exit-code -- src/api/schema.d.ts
      # aide can't read a response type through `impl IntoApiResponse`: handlers name theirs.
      - name: API handlers return concrete types
        run: '! grep -rn "impl IntoApiResponse" packages/web/src'
      # The Astro pages: typed against schema.d.ts, their component tests, and a build with
      # exactly the pages in PAGES, each with the marker the server splices at.
      - name: Astro pages type-check
        working-directory: services/frontend/web
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run vendor && npm run check
      - name: Component tests
        working-directory: services/frontend/web
        run: npm test
      - name: Astro build has exactly the pages
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: (cd web && npm run build) && cargo run -q -p web --features web/server -- check-pages web/dist

  # The built image, as it runs, in a browser: every page for every kind of viewer, the navbar
  # without JavaScript, theme and cookie notice, and axe (no serious or critical violations).
  # Auth and SurrealDB are stand-ins (web/e2e/fake-upstreams.mjs).
  #
  # Built on eta, like the release images: its Docker keeps unchanged layers and the cargo cache
  # mounts between runs, where a GitHub runner would build Rust and the wasm from nothing. Only
  # for pushes (only people who can write to this repository push), never for a pull request's
  # event, so no one else's code runs on eta; a pull request's commits are checked by their push.
  # The browser runs in Playwright's image, so eta needs no browser packages.
  e2e:
    name: e2e
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, eta]
    concurrency:
      group: e2e-eta
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build the image
        uses: docker/build-push-action@v5
        with:
          context: services/frontend
          load: true
          tags: frontend:e2e
          build-args: GIT_SHA=${{ github.sha }}
      - name: No Node in the image
        run: docker run --rm --entrypoint sh frontend:e2e -c '! command -v node && test -z "$(find / -xdev -name node -type f 2>/dev/null)"'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: e2e/serve.sh
      - name: Playwright
        run: |
          version=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')
          docker run --rm --network host --ipc host --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=1 \
            -v "$PWD:/work" -w /work "mcr.microsoft.com/playwright:v$version-noble" \
            sh -c 'npm ci --no-audit --no-fund && npx playwright test'
      - name: Server and stand-in logs
        if: failure()
        run: docker logs frontend-e2e; cat e2e/fake.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: services/frontend/web/playwright-report
      - if: always()
        run: e2e/serve.sh stop; docker image rm frontend:e2e >/dev/null 2>&1 || true

  # The browser extension's scripts, type-checked (tsconfig.json); a job of its own so it runs
  # beside the frontend's.
  extension-types:
    name: extension-types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/arcane-dice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run types

  auth:
    name: auth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/auth
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  ai-pipeline:
    name: ai-pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/ai_pipeline
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The YOLO model for real, in ONNX Runtime on the CPU (the image runs it on the GPU).
      - name: YOLO in ONNX Runtime
        run: |
          curl -sSfL -o /tmp/onnxruntime.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.28.3/onnxruntime-linux-x64-1.28.3.tgz
          echo "db14e4863bd37893fc59729d986ab2a0d043d10b7d44da1913c4982b7e3d009c  /tmp/onnxruntime.tgz" | sha256sum -c
          mkdir /tmp/onnxruntime && tar -xzf /tmp/onnxruntime.tgz -C /tmp/onnxruntime --strip-components=1
          ORT_DYLIB_PATH=/tmp/onnxruntime/lib/libonnxruntime.so cargo test -- --ignored yolo_runs
      # The dice head for real: its ONNX model built from the released weights, as the image does.
      - name: Dice head in ONNX Runtime
        run: |
          curl -sSfL -o /tmp/dice_head.safetensors https://github.com/MilesStorm/website/releases/download/dice-head-v1/dice_head_resnet18.safetensors
          echo "6b6e71693e5b9b667c2d047a3f1dd464017538637eea8c7f6b136c1cf20c2bd9  /tmp/dice_head.safetensors" | sha256sum -c
          python3 -m venv /tmp/onnx && /tmp/onnx/bin/pip install --quiet onnx==1.23.2
          /tmp/onnx/bin/python tools/head_onnx.py /tmp/dice_head.safetensors /tmp/dice_head.onnx
          ORT_DYLIB_PATH=/tmp/onnxruntime/lib/libonnxruntime.so DICE_HEAD_ONNX_PATH=/tmp/dice_head.onnx cargo test -- --ignored head_runs
      # The half-precision copies answer as the f32 models do: the check the service makes on
      # the card at every start, here on the CPU.
      - name: Half-precision models
        run: |
          /tmp/onnx/bin/pip install --quiet onnxruntime==1.31.0 sympy==1.14.0
          /tmp/onnx/bin/python tools/onnx_fp16.py src/model/yolo26s.onnx /tmp/yolo_fp16.onnx
          /tmp/onnx/bin/python tools/onnx_fp16.py /tmp/dice_head.onnx /tmp/dice_head_fp16.onnx
          ORT_DYLIB_PATH=/tmp/onnxruntime/lib/libonnxruntime.so DICE_HEAD_ONNX_PATH=/tmp/dice_head.onnx \
            YOLO_FP16_ONNX_PATH=/tmp/yolo_fp16.onnx DICE_HEAD_FP16_ONNX_PATH=/tmp/dice_head_fp16.onnx \
            cargo test -- --ignored fp16
