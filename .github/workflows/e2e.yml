name: e2e

# The built image, as it runs, in a browser: every page for every kind of viewer, the navbar
# without JavaScript, theme and cookie notice, and axe (no serious or critical violations).
# Auth and Ark are stand-ins (services/frontend/web/e2e/fake-upstreams.mjs); SurrealDB is a real
# one in memory (e2e/serve.sh). A required
# check.
#
# A workflow of its own, with no pull_request trigger: the only `e2e` on a commit is this run's,
# so a skipped job can never stand in for it (a skipped required check counts as passed). A
# pull request's commits are checked by their push; a fork's pull request waits at "Expected"
# until its branch is pushed here.
#
# Built on eta, like the release images: its Docker keeps unchanged layers and the cargo cache
# mounts between runs, where a GitHub runner builds Rust and the wasm from nothing. Only people
# who can write to this repository push to it, except Renovate: its branches carry dependency
# versions no one has reviewed yet, so they build on a GitHub runner instead, never on eta.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ${{ startsWith(github.ref_name, 'renovate/') && 'ubuntu-latest' || fromJSON('["self-hosted", "eta"]') }}
    # A newer push to the same branch replaces a run still waiting; other branches queue.
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: services/frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build the image
        uses: docker/build-push-action@v5
        with:
          context: services/frontend
          load: true
          tags: frontend:e2e
          build-args: GIT_SHA=${{ github.sha }}
      - name: No Node in the image
        run: docker run --rm --entrypoint sh frontend:e2e -c '! command -v node && test -z "$(find / -xdev -name node -type f 2>/dev/null)"'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: e2e/serve.sh
      # The browser runs in Playwright's image (the locked version), so the runner needs no
      # browser packages. No install scripts: the image has the browser already.
      - name: Playwright
        run: |
          version=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')
          docker run --rm --network host --ipc host --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=1 \
            -v "$PWD:/work" -w /work "mcr.microsoft.com/playwright:v$version-noble" \
            sh -c 'npm ci --ignore-scripts --no-audit --no-fund && npx playwright test'
      - name: Server, proxy and stand-in logs
        if: failure()
        run: docker logs frontend-e2e; docker logs frontend-e2e-tls; docker logs frontend-e2e-surreal; cat e2e/fake.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: services/frontend/web/playwright-report
      - if: always()
        run: e2e/serve.sh stop; docker image rm frontend:e2e >/dev/null 2>&1 || true
