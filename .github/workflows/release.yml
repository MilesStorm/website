name: release

# One run per merge to main:
# 1. builds every service whose files changed (all of them on a manual run) as sha-<commit>;
#    and moves the staging tag to it, which staging.milesstorm.com follows (homelab
#    argo/apps/website-staging.yaml).
# 2. runs the end-to-end tests against staging once it serves the new build (staging journeys).
# 3. lists every service whose newest build isn't in production yet (also ones held back earlier)
#    and, once the staging journeys passed, waits for approval. The Review deployments dialog shows one box per such service
#    (production-<service>) plus "production" for all of them; tick either, then approve.
# Shipping moves the production tag (and latest) to that build and adds prod-sha-<commit>; the
# production apps follow the production tag (homelab argo/apps/{frontend,auth,ai-pipeline}.yaml).
# A newer run cancels this run's unanswered boxes.
#
# RELEASE_TOKEN (repo secret): a fine-grained token of the approver, for this repo only, with
# Administration and Deployments read/write. It creates the missing production-<service>
# environments and, after "production" is approved, approves the run's remaining boxes.
#
# The staging journeys log in with staging's test accounts, secrets of the `staging` environment
# (ENV.md, "Staging test accounts"). Staging is behind Miles's GitHub login; they get past it
# with this job's GitHub Actions token (id-token), which the gateway accepts only from this
# workflow in the staging environment (homelab istio/manifests/login-admin-pages.yaml;
# services/frontend/web/e2e/site.ts asks for it).

env:
  REGISTRY: ghcr.io
  # name:directory:Cargo.toml (for the version tag). A new service only needs a line here
  # (and its Argo apps in the homelab repo); its approval box appears on its first release.
  SERVICES: >-
    frontend:services/frontend:crates/bff/Cargo.toml
    auth:services/auth:Cargo.toml
    ai-pipeline:services/ai_pipeline:Cargo.toml

on:
  push:
    branches:
      - main
    paths:
      - services/**
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  changes:
    name: Changed services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: check out repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pick services to build
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          matrix=
          for entry in $SERVICES; do
            IFS=: read -r name dir cargo <<<"$entry"
            # A manual run, or a push with no earlier commit to compare against, builds everything,
            # as does a change to this workflow.
            if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$dir" .github/workflows/release.yml; then
              matrix+="${matrix:+,}{\"name\":\"$name\",\"dir\":\"$dir\",\"cargo\":\"$dir/$cargo\"}"
              echo "build: $name"
            fi
          done
          echo "matrix=[$matrix]" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    name: Build ${{ matrix.name }}
    runs-on: [self-hosted, eta]
    steps:
      - name: check out repo code
        uses: actions/checkout@v4

      - name: Crate Version
        id: crate-version
        uses: colathro/crate-version@1.0.0
        with:
          file: ${{ matrix.cargo }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/milesstorm/${{ matrix.name }}
          # No automatic latest (the semver tag would add it): only shipping moves latest.
          flavor: latest=false
          # staging: the newest build, which staging.milesstorm.com runs.
          tags: |
            type=raw,value=staging
            type=sha
            type=semver,pattern={{version}},value=${{ steps.crate-version.outputs.version }}

      # Build with eta's own Docker instead of a fresh, empty builder per run, so
      # unchanged layers are reused from the previous build.
      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # service.version on every span, log and profile (TRACING.md).
          build-args: GIT_SHA=${{ github.sha }}

      # Each build moves the tags to a new image and leaves the old one behind
      # untagged on eta, so disk use grew with every deploy. Remove those
      # untagged images and cap the build cache (keeps the cooked dependencies).
      - name: clean up old images on eta
        if: always() && matrix.name == 'ai-pipeline'
        run: |
          docker image prune -f
          docker builder prune -f --keep-storage 20GB

  # The end-to-end tests (services/frontend/web/e2e) against https://staging.milesstorm.com, with
  # real auth and staging's test accounts. Nothing is uploaded: this repository is public, and a
  # report would hold those accounts' sessions.
  journeys:
    needs: build
    # Not after a failed build; a run that built nothing still tests staging.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    name: staging journeys
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: read
      packages: read
      id-token: write
    defaults:
      run:
        working-directory: services/frontend/web
    steps:
      - name: check out repo code
        uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Staging follows the staging tags through Image Updater (every 2 minutes), then Argo syncs
      # and the pods roll out. The frontend says which commit it was built from (<meta
      # name="service-version">): wait until it is the staging tag's. Auth and ai-pipeline can't
      # be asked from outside; Image Updater pins all three in the same pass, so when this run
      # built them with the frontend, the frontend's wait covers them. When it built them without
      # the frontend, wait a fixed 5 minutes instead.
      - name: wait for staging to serve the new build
        run: |
          revision() {
            docker buildx imagetools inspect "$REGISTRY/milesstorm/$1:staging" \
              --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null
          }
          frontend=$(revision frontend) || true
          [ -n "$frontend" ] || { echo "::error::No frontend staging build"; exit 1; }
          deadline=$((SECONDS + 600))
          until curl -sSf --max-time 20 -H "x-staging-journeys-token: $(curl -sSf --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=staging.milesstorm.com" | jq -r .value)" https://staging.milesstorm.com/ \
            | grep -qF "<meta name=\"service-version\" content=\"$frontend\">"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::Staging didn't serve frontend ${frontend::7} within 10 minutes"; exit 1; }
            sleep 15
          done
          echo "staging serves frontend ${frontend::7}"
          if [ "$frontend" != "$GITHUB_SHA" ] \
            && { [ "$(revision auth)" = "$GITHUB_SHA" ] || [ "$(revision ai-pipeline)" = "$GITHUB_SHA" ]; }; then
            echo "auth or ai-pipeline built without the frontend: waiting 5 minutes for them to roll out"
            sleep 300
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          E2E_BASE_URL: https://staging.milesstorm.com
          E2E_PLAIN_USERNAME: ${{ secrets.STAGING_PLAIN_USERNAME }}
          E2E_PLAIN_PASSWORD: ${{ secrets.STAGING_PLAIN_PASSWORD }}
          E2E_ALL_USERNAME: ${{ secrets.STAGING_ALL_USERNAME }}
          E2E_ALL_PASSWORD: ${{ secrets.STAGING_ALL_PASSWORD }}

  # Every service whose staging build (staging tag) isn't what production runs (production tag),
  # compared by the commit each was built from. A failed build leaves the staging tag where it was.
  plan:
    needs: [changes, build]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    name: What can ship
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.pending.outputs.matrix }}
    steps:
      - name: check out repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: find builds not in production
        id: pending
        run: |
          revision() {
            docker buildx imagetools inspect "$1" \
              --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null
          }
          matrix=
          echo "| Service | Build | Last change |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for entry in $SERVICES; do
            IFS=: read -r name _ <<<"$entry"
            image=$REGISTRY/milesstorm/$name
            commit=$(revision "$image:staging") || { echo "$name: no staging build, skipped"; continue; }
            [ "$commit" = "$(revision "$image:production")" ] && { echo "$name: ${commit::7} already in production"; continue; }
            # Manual runs from other branches also reach staging; only builds of main may ship.
            git merge-base --is-ancestor "$commit" HEAD 2>/dev/null \
              || { echo "$name: staging runs ${commit::7}, which isn't on main, skipped"; continue; }
            tag=sha-${commit::7}
            matrix+="${matrix:+,}{\"name\":\"$name\",\"tag\":\"$tag\"}"
            echo "| $name | $tag | $(git log -1 --format=%s "$commit" | sed 's/|/\\|/g') |" >> "$GITHUB_STEP_SUMMARY"
          done
          [ -n "$matrix" ] || echo "Nothing to ship: production runs every staging build." >> "$GITHUB_STEP_SUMMARY"
          echo "matrix=[$matrix]" >> "$GITHUB_OUTPUT"

      - name: create missing approval boxes
        if: steps.pending.outputs.matrix != '[]'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          MATRIX: ${{ steps.pending.outputs.matrix }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Repo secret RELEASE_TOKEN is missing (see the top of release.yml)"; exit 1; }
          for environment in production $(jq -r '.[] | "production-" + .name' <<<"$MATRIX"); do
            gh api "repos/$GITHUB_REPOSITORY/environments/$environment" --silent 2>/dev/null && continue
            # Only the owner may approve, and only runs from main.
            jq -n --argjson id "$OWNER_ID" \
              '{reviewers: [{type: "User", id: $id}], deployment_branch_policy: {protected_branches: false, custom_branch_policies: true}}' \
              | gh api -X PUT "repos/$GITHUB_REPOSITORY/environments/$environment" --input - --silent
            gh api -X POST "repos/$GITHUB_REPOSITORY/environments/$environment/deployment-branch-policies" \
              -f name=main -f type=branch --silent
            echo "created environment $environment"
          done

  # The "production" box: ships every service in the plan, then approves the run's other boxes
  # (their jobs just repeat the same tagging).
  ship-all:
    needs: [plan, journeys]
    if: needs.plan.outputs.matrix != '[]' && needs.plan.outputs.matrix != ''
    environment: production
    concurrency:
      group: ship-all
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    name: Ship everything
    runs-on: ubuntu-latest
    steps:
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tag the tested images for production
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          jq -r '.[] | "\(.name) \(.tag)"' <<<"$MATRIX" | while read -r name tag; do
            image=$REGISTRY/milesstorm/$name
            docker buildx imagetools create -t "$image:prod-$tag" -t "$image:production" -t "$image:latest" "$image:$tag"
            echo "$name: $tag shipped"
          done

      - name: approve the per-service boxes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/pending_deployments" --jq '[.[].environment.id]')
          [ "$ids" = "[]" ] && exit 0
          jq -n --argjson ids "$ids" '{environment_ids: $ids, state: "approved", comment: "Shipped with everything"}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/pending_deployments" --input - --silent

  # One box per service (production-<service>): ships just that service.
  ship:
    needs: [plan, journeys]
    if: needs.plan.outputs.matrix != '[]' && needs.plan.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment: production-${{ matrix.name }}
    concurrency:
      group: ship-${{ matrix.name }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    name: Ship ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tag the tested image for production
        env:
          NAME: ${{ matrix.name }}
          TAG: ${{ matrix.tag }}
        run: |
          image=$REGISTRY/milesstorm/$NAME
          docker buildx imagetools create -t "$image:prod-$TAG" -t "$image:production" -t "$image:latest" "$image:$TAG"
          echo "$NAME: $TAG shipped"
