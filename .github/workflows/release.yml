name: release

# One run per merge to main. It builds every service whose files changed (all of them on a manual
# run) and pushes each as sha-<commit>; staging.milesstorm.com follows those tags on its own.
# Approving the "Promote to production" job then sends everything this run built to production
# (tags prod-sha-<commit>, the only tags production follows: homelab argo/apps).
# To send only some services, leave that job waiting and run the promote workflow instead.

env:
  REGISTRY: ghcr.io

on:
  push:
    branches:
      - main
    paths:
      - services/frontend/**
      - services/auth/**
      - services/ai_pipeline/**
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  changes:
    name: Changed services
    runs-on: [self-hosted, eta]
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      names: ${{ steps.pick.outputs.names }}
    steps:
      - name: check out repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep the directories in step with promote.yml, which finds each service's latest build
      # from the last commit that touched them.
      - name: pick services to build
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          declare -A dir=([frontend]=services/frontend [auth]=services/auth [ai-pipeline]=services/ai_pipeline)
          declare -A cargo=([frontend]=packages/web/Cargo.toml [auth]=Cargo.toml [ai-pipeline]=Cargo.toml)
          picked=()
          for name in frontend auth ai-pipeline; do
            # A manual run, or a push with no earlier commit to compare against, builds everything,
            # as does a change to this workflow.
            if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "${dir[$name]}" .github/workflows/release.yml; then
              picked+=("$name")
            fi
          done
          matrix=
          for name in "${picked[@]}"; do
            matrix+="${matrix:+,}{\"name\":\"$name\",\"dir\":\"${dir[$name]}\",\"cargo\":\"${dir[$name]}/${cargo[$name]}\"}"
          done
          echo "matrix=[$matrix]" >> "$GITHUB_OUTPUT"
          echo "names=${picked[*]}" >> "$GITHUB_OUTPUT"
          echo "Building: ${picked[*]:-nothing}"

  build:
    needs: changes
    if: needs.changes.outputs.names != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    name: Build ${{ matrix.name }}
    runs-on: [self-hosted, eta]
    steps:
      - name: check out repo code
        uses: actions/checkout@v4

      - name: Crate Version
        id: crate-version
        uses: colathro/crate-version@1.0.0
        with:
          file: ${{ matrix.cargo }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/milesstorm/${{ matrix.name }}
          tags: |
            type=sha
            type=semver,pattern={{version}},value=${{ steps.crate-version.outputs.version }}

      # Build with eta's own Docker instead of a fresh, empty builder per run, so
      # unchanged layers are reused from the previous build.
      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Each build moves the tags to a new image and leaves the old one behind
      # untagged on eta, so disk use grew with every deploy. Remove those
      # untagged images and cap the build cache (keeps the cooked dependencies).
      - name: clean up old images on eta
        if: always() && matrix.name == 'ai-pipeline'
        run: |
          docker image prune -f
          docker builder prune -f --keep-storage 20GB

  # Approve once the build checks out on staging.milesstorm.com: tags the same images
  # prod-sha-<commit> (and latest). Runs only if every build in this run succeeded.
  promote:
    needs: [changes, build]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.names != ''
    environment: production
    permissions:
      contents: read
      packages: write
    name: Promote to production
    runs-on: [self-hosted, eta]
    steps:
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: tag the tested images for production
        env:
          NAMES: ${{ needs.changes.outputs.names }}
        run: |
          tag=sha-${GITHUB_SHA::7}
          for name in $NAMES; do
            image=$REGISTRY/milesstorm/$name
            docker buildx imagetools create -t "$image:prod-$tag" -t "$image:latest" "$image:$tag"
            echo "$name: $tag → production"
          done
