name: auth-build

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches:
      - main
    paths: 
    - services/auth/**
    - .github/workflows/auth.yaml
  workflow_dispatch:

jobs:
  build:    
    permissions:
      contents: read
      packages: write
    name: Build
    runs-on: [self-hosted, eta]
    steps:
      - name: check out repo code
        uses: actions/checkout@v4
        
      - name: Crate Version
        id: crate-version
        uses: colathro/crate-version@1.0.0
        with:
          file: "services/auth/Cargo.toml"
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/milesstorm/auth
          tags: | 
            type=sha
            type=semver,pattern={{version}},value=${{ steps.crate-version.outputs.version }}

      # Build with eta's own Docker instead of a fresh, empty builder per run, so
      # unchanged layers are reused from the previous build.
      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: build and push
        uses: docker/build-push-action@v5
        with: 
          context: services/auth
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Every main build goes to staging.milesstorm.com first (it follows the sha-* tags). Once it
  # checks out there, approve this job: it tags that same image prod-sha-*, which is the only tag
  # production follows (homelab argo/apps). Manual runs from other branches reach staging only.
  promote:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write
    name: Promote to production
    runs-on: [self-hosted, eta]
    steps:
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: tag the tested image for production
        run: |
          image=${{ env.REGISTRY }}/milesstorm/auth
          tag=sha-${GITHUB_SHA::7}
          docker buildx imagetools create -t "$image:prod-$tag" -t "$image:latest" "$image:$tag"
