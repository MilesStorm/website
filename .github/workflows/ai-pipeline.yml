name: ai-pipeline-build

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches:
      - main
      # Builds from the staging branch go to separate *-staging images,
      # which only the website-staging app (homelab repo) follows.
      - staging
    paths:
      - services/ai_pipeline/**
      - .github/workflows/ai-pipeline.yml
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      packages: write
    name: Build
    runs-on: [self-hosted, eta]
    steps:
      - name: check out repo code
        uses: actions/checkout@v4

      - name: Crate Version
        id: crate-version
        uses: colathro/crate-version@1.0.0
        with:
          file: "services/ai_pipeline/Cargo.toml"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/milesstorm/ai-pipeline${{ github.ref_name == 'staging' && '-staging' || '' }}
          tags: |
            type=raw,value=latest
            type=sha
            type=semver,pattern={{version}},value=${{ steps.crate-version.outputs.version }}

      # Build with eta's own Docker instead of a fresh, empty builder per run, so
      # unchanged layers are reused from the previous build.
      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: build and push
        uses: docker/build-push-action@v5
        with:
          context: services/ai_pipeline
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Each build moves the tags to a new image and leaves the old one behind
      # untagged on eta, so disk use grew with every deploy. Remove those
      # untagged images and cap the build cache (keeps the cooked dependencies).
      - name: clean up old images on eta
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --keep-storage 20GB
