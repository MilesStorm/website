name: ci

# Every check of a commit, on every push to any branch. No pull_request trigger: a pull
# request's commits are checked by their push, so nothing runs twice and a skipped job can never
# stand in for a required check (a skipped required check counts as passed). A fork's pull
# request waits at "Expected" until its branch is pushed here. No path filters: frontend, auth,
# ai-pipeline and e2e are required checks (ruleset "Main protection"), so they must always run.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Where jobs run: the ones that compile Rust run on the cluster's runners (homelab repo,
# ci-runners), beside the compile cache (.github/actions/rust). The light ones (Astro pages,
# extension-types, trace-checker and the frontend summary) have nothing to cache and stay on
# GitHub's. Renovate's branches carry dependency versions no one has reviewed yet: they run on
# GitHub's runners and never write to the compile cache.
#
# Line tables are enough for a panic's backtrace; full debug info more than doubles what the
# compile cache stores, and slows the link.
env:
  SCCACHE_WEBDAV_ENDPOINT: ${{ !startsWith(github.ref_name, 'renovate/') && 'http://sccache.arc-runners.svc.cluster.local' || '' }}
  SCCACHE_WEBDAV_DISABLE_CREATE_DIR: "true"
  SCCACHE_SKIP_CACHE_CHECK: "true"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # The frontend's BFF: clippy and tests, the API contract, and the Astro build it serves.
  # One compile for clippy and one for the tests; the contract and page checks run the server
  # binary the tests built. The Astro build needs no Rust, so it runs beside them.
  frontend-rust:
    name: "frontend: BFF server"
    runs-on: ${{ startsWith(github.ref_name, 'renovate/') && 'ubuntu-latest' || 'homelab' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # In the background (npm ci is most of it); "Astro build has exactly the pages" waits for
      # it. The runner ends leftover processes only when the job ends.
      - name: Astro build (background)
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: |
          # The step's shell exits on the first error (-e): the condition of an if doesn't, so
          # the exit status always lands in astro.rc, which the later step waits for.
          {
            if (cd web && npm ci && npm run tracing && npm run build); then rc=0; else rc=1; fi
            echo $rc > "$RUNNER_TEMP/astro.rc"
          } > "$RUNNER_TEMP/astro.log" 2>&1 &
      - uses: ./.github/actions/rust
        with:
          job: frontend-rust
          workspace: services/frontend
      # From crates.io, on a run that restored no snapshot (.github/actions/rust).
      - name: Crate downloads
        run: cargo fetch
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Also builds target/debug/server, which the steps below run.
      - name: Rust tests
        run: cargo test
      # The committed API contract is what the handlers say (web/src/api/openapi.json); the
      # TypeScript types generated from it are checked in frontend (web). Regenerate both with
      # `npm run api` in web/.
      - name: OpenAPI document is current
        run: target/debug/server openapi | diff - web/src/api/openapi.json
      # aide can't read a response type through `impl IntoApiResponse`: handlers name theirs.
      - name: API handlers return concrete types
        run: '! grep -rn "impl IntoApiResponse" crates/bff/src'
      # A build with exactly the pages in PAGES, each with the marker the server splices at.
      - name: Astro build has exactly the pages
        run: |
          while [ ! -f "$RUNNER_TEMP/astro.rc" ]; do sleep 1; done
          cat "$RUNNER_TEMP/astro.log"
          [ "$(cat "$RUNNER_TEMP/astro.rc")" = 0 ]
          target/debug/server check-pages web/dist
      # For the next run (.github/actions/rust), once every check passed.
      - name: Store the build
        if: success() && env.RUST_SNAPSHOT_KEY != ''
        run: bash "$GITHUB_WORKSPACE/.github/actions/rust/snapshot.sh" save
      - name: Compile cache hits
        if: always() && env.RUSTC_WRAPPER != ''
        run: sccache --show-stats
      # Which node the job ran on (NODE_NAME, from the runner pod's spec), and what the job's
      # container used at most, to size the runners' memory limit. The peak counts
      # page cache, which the kernel drops at the limit: `max` is how often usage reached the
      # limit, `oom_kill` how many processes it killed, and memory.pressure how long the job's
      # processes waited for memory (`total`, microseconds).
      - name: Memory peak
        if: always() && runner.environment == 'self-hosted'
        run: |
          echo "node: ${NODE_NAME:-not set (pod $(hostname))}"
          echo "$(( $(cat /sys/fs/cgroup/memory.peak) / 1048576 )) MiB"
          grep -E '^(max|oom_kill) ' /sys/fs/cgroup/memory.events || true
          cat /sys/fs/cgroup/memory.pressure || true

  # The Astro pages, beside the Rust: their TypeScript API types are current, they type-check
  # against them, and their component and tracing script tests.
  frontend-web:
    name: "frontend: Astro pages"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: TypeScript API types are current
        run: npm ci && npm run api:types && git diff --exit-code -- src/api/schema.d.ts
      - name: Astro pages type-check
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run tracing && npm run check
      - name: Component tests
        run: npm test
      - name: Tracing script tests
        run: npm run test:trace

  # The required check (ruleset "Main protection"): both halves passed.
  frontend:
    name: frontend
    needs: [frontend-rust, frontend-web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: BFF server and Astro pages both passed
        run: test "${{ needs.frontend-rust.result }}" = success && test "${{ needs.frontend-web.result }}" = success

  # The browser extension's scripts, type-checked (tsconfig.json).
  extension-types:
    name: extension-types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension/arcane-dice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm run types

  # The auth service: clippy and tests.
  auth:
    name: auth
    runs-on: ${{ startsWith(github.ref_name, 'renovate/') && 'ubuntu-latest' || 'homelab' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          job: auth
          workspace: services/auth
          packages: pkg-config libssl-dev
      - name: Crate downloads
        run: cargo fetch
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # For the next run (.github/actions/rust), once every check passed.
      - name: Store the build
        if: success() && env.RUST_SNAPSHOT_KEY != ''
        run: bash "$GITHUB_WORKSPACE/.github/actions/rust/snapshot.sh" save
      - name: Compile cache hits
        if: always() && env.RUSTC_WRAPPER != ''
        run: sccache --show-stats
      # Which node the job ran on (NODE_NAME, from the runner pod's spec), and what the job's
      # container used at most, to size the runners' memory limit. The peak counts
      # page cache, which the kernel drops at the limit: `max` is how often usage reached the
      # limit, `oom_kill` how many processes it killed, and memory.pressure how long the job's
      # processes waited for memory (`total`, microseconds).
      - name: Memory peak
        if: always() && runner.environment == 'self-hosted'
        run: |
          echo "node: ${NODE_NAME:-not set (pod $(hostname))}"
          echo "$(( $(cat /sys/fs/cgroup/memory.peak) / 1048576 )) MiB"
          grep -E '^(max|oom_kill) ' /sys/fs/cgroup/memory.events || true
          cat /sys/fs/cgroup/memory.pressure || true

  # The dice pipeline: clippy and tests, then its models for real in ONNX Runtime on the CPU.
  # It builds without CUDA (burn loads it at run time) and no test needs a GPU.
  ai-pipeline:
    name: ai-pipeline
    runs-on: ${{ startsWith(github.ref_name, 'renovate/') && 'ubuntu-latest' || 'homelab' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ai_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          job: ai-pipeline
          workspace: services/ai_pipeline
          packages: python3-venv
      - name: Crate downloads
        run: cargo fetch
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The YOLO model for real, in ONNX Runtime on the CPU (the image runs it on the GPU).
      - name: YOLO in ONNX Runtime
        run: |
          curl -sSfL -o $RUNNER_TEMP/onnxruntime.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.28.3/onnxruntime-linux-x64-1.28.3.tgz
          echo "db14e4863bd37893fc59729d986ab2a0d043d10b7d44da1913c4982b7e3d009c  $RUNNER_TEMP/onnxruntime.tgz" | sha256sum -c
          mkdir $RUNNER_TEMP/onnxruntime && tar -xzf $RUNNER_TEMP/onnxruntime.tgz -C $RUNNER_TEMP/onnxruntime --strip-components=1
          ORT_DYLIB_PATH=$RUNNER_TEMP/onnxruntime/lib/libonnxruntime.so cargo test -- --ignored yolo_runs
      # The dice head for real: its ONNX model built from the released weights, as the image does.
      - name: Dice head in ONNX Runtime
        run: |
          curl -sSfL -o $RUNNER_TEMP/dice_head.safetensors https://github.com/MilesStorm/website/releases/download/dice-head-v1/dice_head_resnet18.safetensors
          echo "6b6e71693e5b9b667c2d047a3f1dd464017538637eea8c7f6b136c1cf20c2bd9  $RUNNER_TEMP/dice_head.safetensors" | sha256sum -c
          python3 -m venv $RUNNER_TEMP/onnx && $RUNNER_TEMP/onnx/bin/pip install --quiet --no-cache-dir onnx==1.23.2
          $RUNNER_TEMP/onnx/bin/python tools/head_onnx.py $RUNNER_TEMP/dice_head.safetensors $RUNNER_TEMP/dice_head.onnx
          ORT_DYLIB_PATH=$RUNNER_TEMP/onnxruntime/lib/libonnxruntime.so DICE_HEAD_ONNX_PATH=$RUNNER_TEMP/dice_head.onnx cargo test -- --ignored head_runs
      # The half-precision copies answer as the f32 models do: the check the service makes on
      # the card at every start, here on the CPU.
      - name: Half-precision models
        run: |
          $RUNNER_TEMP/onnx/bin/pip install --quiet --no-cache-dir onnxruntime==1.31.0 sympy==1.14.0
          $RUNNER_TEMP/onnx/bin/python tools/onnx_fp16.py src/model/yolo26s.onnx $RUNNER_TEMP/yolo_fp16.onnx
          $RUNNER_TEMP/onnx/bin/python tools/onnx_fp16.py $RUNNER_TEMP/dice_head.onnx $RUNNER_TEMP/dice_head_fp16.onnx
          ORT_DYLIB_PATH=$RUNNER_TEMP/onnxruntime/lib/libonnxruntime.so DICE_HEAD_ONNX_PATH=$RUNNER_TEMP/dice_head.onnx \
            YOLO_FP16_ONNX_PATH=$RUNNER_TEMP/yolo_fp16.onnx DICE_HEAD_FP16_ONNX_PATH=$RUNNER_TEMP/dice_head_fp16.onnx \
            cargo test -- --ignored fp16
      # For the next run (.github/actions/rust), once every check passed.
      - name: Store the build
        if: success() && env.RUST_SNAPSHOT_KEY != ''
        run: bash "$GITHUB_WORKSPACE/.github/actions/rust/snapshot.sh" save
      - name: Compile cache hits
        if: always() && env.RUSTC_WRAPPER != ''
        run: sccache --show-stats
      # Which node the job ran on (NODE_NAME, from the runner pod's spec), and what the job's
      # container used at most, to size the runners' memory limit. The peak counts
      # page cache, which the kernel drops at the limit: `max` is how often usage reached the
      # limit, `oom_kill` how many processes it killed, and memory.pressure how long the job's
      # processes waited for memory (`total`, microseconds).
      - name: Memory peak
        if: always() && runner.environment == 'self-hosted'
        run: |
          echo "node: ${NODE_NAME:-not set (pod $(hostname))}"
          echo "$(( $(cat /sys/fs/cgroup/memory.peak) / 1048576 )) MiB"
          grep -E '^(max|oom_kill) ' /sys/fs/cgroup/memory.events || true
          cat /sys/fs/cgroup/memory.pressure || true

  # The frontend's built image, as it runs, in a browser: every page for every kind of viewer,
  # the navbar without JavaScript, theme and cookie notice, and axe (no serious or critical
  # violations). Auth and Ark are stand-ins (services/frontend/web/e2e/fake-upstreams.mjs);
  # SurrealDB is a real one in memory (e2e/serve.sh). Runs on the cluster's runners, like the
  # release builds (homelab repo, ci-runners): the image is built by the node's shared BuildKit,
  # which keeps unchanged layers between runs, and compiles through the compile cache. Renovate's
  # branches carry dependency versions no one has reviewed yet, so they build on a GitHub runner
  # instead, without the compile cache.
  e2e:
    name: e2e
    runs-on: ${{ startsWith(github.ref_name, 'renovate/') && 'ubuntu-latest' || 'homelab' }}
    timeout-minutes: 30
    # A newer push to the same branch replaces its run still in progress.
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: services/frontend/web
    # The cluster's pull-through registry (homelab repo, ci-runners): an image from another
    # registry is pulled as $REGISTRY_MIRROR/<registry>/<repository>:<tag> and named as usual, or
    # straight from its registry when the mirror fails. Docker Hub's go through it without a
    # prefix (Docker's own registry-mirror setting in the runner pods). Not on GitHub's runners.
    env:
      REGISTRY_MIRROR: ${{ !startsWith(github.ref_name, 'renovate/') && 'registry-cache.arc-runners.svc.cluster.local:5000' || '' }}
    steps:
      - uses: actions/checkout@v4
      # What the tests run in, fetched while the image builds: Playwright's image (the locked
      # version) with the packages installed in it, and the services e2e/serve.sh starts. The
      # browser tests wait for it.
      - name: Start downloading the test browser and services
        run: |
          version=$(grep -A3 '"node_modules/@playwright/test"' package-lock.json | sed -n 's/.*"version": "\(.*\)".*/\1/p')
          test -n "$version"
          echo "PLAYWRIGHT_IMAGE=mcr.microsoft.com/playwright:v$version-noble" >> "$GITHUB_ENV"
          pull() {
            if [ -n "$REGISTRY_MIRROR" ] && docker pull -q "$REGISTRY_MIRROR/$1"; then
              docker tag "$REGISTRY_MIRROR/$1" "$1"
            else
              docker pull -q "$1"
            fi
          }
          fetch() {
            pids=()
            for image in redis:7-alpine surrealdb/surrealdb:v3.2.4 caddy:2.10.2-alpine; do
              docker pull -q "$image" & pids+=($!)
            done
            pull "mcr.microsoft.com/playwright:v$version-noble" || return 1
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work \
              "mcr.microsoft.com/playwright:v$version-noble" npm ci --ignore-scripts --no-audit --no-fund || return 1
            for pid in "${pids[@]}"; do wait "$pid" || return 1; done
          }
          { fetch > /tmp/fetch.log 2>&1 < /dev/null; echo $? > /tmp/fetch.status; } &
      - uses: docker/setup-buildx-action@v3
        with:
          driver: ${{ startsWith(github.ref_name, 'renovate/') && 'docker' || 'remote' }}
          endpoint: ${{ !startsWith(github.ref_name, 'renovate/') && 'tcp://buildkitd.arc-runners:1234' || '' }}
      - name: Build the image
        uses: docker/build-push-action@v5
        with:
          context: services/frontend
          load: true
          tags: frontend:e2e
          build-args: |
            GIT_SHA=${{ github.sha }}
            SCCACHE_WEBDAV_ENDPOINT=${{ env.SCCACHE_WEBDAV_ENDPOINT }}
      - name: No Node in the image
        run: docker run --rm --entrypoint sh frontend:e2e -c '! command -v node && test -z "$(find / -xdev -name node -type f 2>/dev/null)"'
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Wait for the test browser and services
        run: |
          for _ in $(seq 600); do test -f /tmp/fetch.status && break; sleep 1; done
          cat /tmp/fetch.log
          test "$(cat /tmp/fetch.status 2>/dev/null)" = 0
      - name: Start the site and its stand-in services
        run: e2e/serve.sh
      # The browser runs in Playwright's image (the locked version), so the runner needs no
      # browser packages. No install scripts: the image has the browser already.
      - name: Browser tests
        run: |
          docker run --rm --network host --ipc host --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=1 \
            -v "$PWD:/work" -w /work "$PLAYWRIGHT_IMAGE" npx playwright test
      - name: Server, proxy and stand-in logs
        if: failure()
        run: docker logs frontend-e2e; docker logs frontend-e2e-tls; docker logs frontend-e2e-surreal; cat e2e/fake.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: services/frontend/web/playwright-report
      - if: always()
        run: e2e/serve.sh stop; docker image rm frontend:e2e >/dev/null 2>&1 || true
      # Which node the job ran on (NODE_NAME, from the runner pod's spec), and what the runner
      # container and Docker's containers (the site, its stand-ins, the browser) used at most, to
      # size the runners' memory limits. The image builds in BuildKit, not here. Docker runs in its
      # own container of the pod and puts its containers under /docker of its cgroup namespace
      # (the namespace's root has no memory.peak); a container in that namespace reads it.
      - name: Memory peak (runner and Docker, not BuildKit)
        if: always() && runner.environment == 'self-hosted'
        run: |
          echo "node: ${NODE_NAME:-not set (pod $(hostname))}"
          echo "runner: $(( $(cat /sys/fs/cgroup/memory.peak) / 1048576 )) MiB"
          grep -E '^(max|oom_kill) ' /sys/fs/cgroup/memory.events || true
          if peak=$(docker run --rm --cgroupns host --entrypoint cat "$PLAYWRIGHT_IMAGE" /sys/fs/cgroup/docker/memory.peak 2>&1); then
            echo "docker: $(( peak / 1048576 )) MiB"
          else
            echo "docker: not readable: $peak"
            docker run --rm --cgroupns host --entrypoint ls "$PLAYWRIGHT_IMAGE" /sys/fs/cgroup || true
          fi

  # The trace contract checker's own tests (tracing/checker).
  trace-checker:
    name: trace-checker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest tracing/checker/test_trace_check.py
